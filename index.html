<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THB Translator — Tradutor Online Gratuito (Inglês e Português)</title>
  <meta name="description" content="THB Translator é um tradutor web rápido e gratuito entre Inglês e Português com troca instantânea de idiomas.">
  <meta name="keywords" content="THB Translator, tradutor online, inglês para português, português para inglês, THB">
  <meta name="author" content="Tomás Herculano Bia">
  <link rel="canonical" href="https://btomasherculano-cmyk.github.io/thb-translator/">

  <!-- Metadados para motores de busca e partilha -->
  <meta property="og:title" content="THB Translator">
  <meta property="og:description" content="Tradutor online rápido e gratuito entre Inglês e Português.">
  <meta property="og:url" content="https://btomasherculano-cmyk.github.io/thb-translator/">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="style.css">
</head>

  <body>
<div class="container">
  <h1>THB Translator</h1>

  <label for="idioma-origem">De:</label>
  <select id="idioma-origem">
    <option value="pt">Português</option>
    <option value="en">Inglês</option>
  </select>

  <button type="button" id="btn-trocar" class="btn-secundario">⇄ Trocar idiomas</button>

  <label for="idioma-destino">Para:</label>
  <select id="idioma-destino">
    <option value="en">Inglês</option>
    <option value="pt">Português</option>
  </select>

  <textarea id="texto-entrada" rows="4" placeholder="Escreva aqui o texto para traduzir..."></textarea>

  <button id="btn-traduzir">Traduzir</button>

  <div class="resultado">
    <h3>Tradução:</h3>
    <p id="texto-saida">A tradução vai aparecer aqui.</p>
  </div>
</div>
>

    <script src="./script.js"></script>
  </body>
</html>
